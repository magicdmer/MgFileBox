<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} - MgFileBox</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=20261101-13">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="/upload" class="brand-mark" data-app-view="upload">
        <svg class="brand-mark__cube" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span class="brand-mark__name">MgFileBox</span>
      </a>
      <nav class="nav-pills">
        <a href="/upload" class="nav-pill" data-app-view="upload">上传</a>
        <a href="/admin/shares" class="nav-pill" data-app-view="admin">管理</a>
        <a href="/about" class="nav-pill {{ if eq .ActiveNav "about" }}is-active{{ end }}" data-app-view="about">关于</a>
        <a href="/logout" class="nav-pill">退出</a>
      </nav>
    </header>

    <main class="panel panel-wide about-page">
      <section class="about-content">
        <div class="about-logo" aria-hidden="true">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <h1>MgFileBox</h1>
        <p class="about-tagline">轻量、私有的文件分享站</p>
        <span class="about-version">版本 {{ if eq .Version "dev" }}开发版{{ else }}{{ .Version }}{{ end }}</span>
        <p class="about-description">面向个人部署的文件分享工具，提供文件上传、提取码保护、分享有效期和分享管理。文件过期后保留，由管理员手动删除。</p>
        <div class="about-actions">
          <a class="button button-primary button-compact" href="https://github.com/magicdmer/MgFileBox" target="_blank" rel="noreferrer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.39.97.1-.75.4-1.27.74-1.56-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18A10.96 10.96 0 0 1 12 6.11c.98 0 1.95.13 2.87.39 2.19-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.15v3.26c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7z"></path>
            </svg>
            GitHub 项目
          </a>
          <a class="button button-secondary button-compact" href="https://github.com/magicdmer/MgFileBox/issues" target="_blank" rel="noreferrer">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
              <path d="M8 9h8M8 13h5"></path>
            </svg>
            问题反馈
          </a>
        </div>
        <p class="about-note">欢迎通过 GitHub Issues 提交问题与建议。</p>
        <p class="about-license">基于 MIT License 开源</p>
      </section>
    </main>
  </div>

  <script src="/static/app.js?v=20261101-14"></script>
</body>
</html>
